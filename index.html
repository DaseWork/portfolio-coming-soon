<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- DaWork Responsive Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Munoz | Graphic Designer</title>
    
    <!-- DaWork SEO & Favicon Placeholders -->
    <meta name="description" content="Portfolio of David Munoz, Graphic Designer based in Austin, TX.">
    <!-- <link rel="icon" href="/favicon.ico" sizes="any"> -->
    <!-- <link rel="icon" href="/favicon-32x32.png" type="image/png"> -->
    <!-- <link rel="apple-touch-icon" href="/apple-touch-icon.png"> -->

    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration (Easy to change vibe later) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            // Easily swap these hex codes to change the entire vibe later
                            orange: '#E34A27', 
                            black: '#0D0D0D',
                            white: '#F4F4F4'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for the Editorial Text Outline Effect -->
    <style type="text/tailwindcss">
        @layer utilities {
            .text-outline {
                color: transparent;
                -webkit-text-stroke: 1.5px #F4F4F4;
            }
            @media (min-width: 768px) {
                .text-outline {
                    -webkit-text-stroke: 2px #F4F4F4;
                }
            }
        }
        
        /* Custom Loading Bar Animation */
        @keyframes slide-infinite {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
        .animate-slide-infinite {
            animation: slide-infinite 1.5s linear infinite;
        }
    </style>
</head>
<body class="bg-brand-black text-brand-white font-sans antialiased selection:bg-brand-orange selection:text-white">

    <!-- Main Split Layout -->
    <main class="min-h-screen flex flex-col md:flex-row w-full">
        
        <!-- Left Pane: The Hook (Burnt Orange) -->
        <div class="w-full md:w-1/2 bg-brand-orange p-8 md:p-12 lg:p-20 flex flex-col justify-between min-h-[50vh] md:min-h-screen relative overflow-hidden">
            
            <!-- Header/Logo Area -->
            <header class="flex justify-between items-start z-10 relative w-full">
                
                <!-- Foundational Design Shapes (Square, Triangle, Circle) -->
                <div class="flex gap-[6px] items-center text-brand-white mt-1">
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><rect width="16" height="16" /></svg>
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><polygon points="8,0 16,16 0,16" /></svg>
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="8" /></svg>
                </div>

                <!-- WIP Pill & Loading Bar -->
                <div class="flex flex-col items-end gap-2 w-48 md:w-56">
                    <span id="wip-text" class="text-[10px] md:text-xs font-medium tracking-widest uppercase border border-brand-white/30 px-3 py-1 rounded-full transition-colors duration-500 whitespace-nowrap">
                        Portfolio Coming Soon
                    </span>
                    <!-- Bar Container -->
                    <div class="w-full h-1 bg-brand-white/20 rounded-full overflow-hidden relative">
                        <!-- Sliding Indicator -->
                        <div id="loading-bar" class="absolute top-0 left-0 h-full w-1/3 bg-brand-white animate-slide-infinite transition-colors duration-500"></div>
                    </div>
                </div>

            </header>

            <!-- Massive Typography Block -->
            <div class="z-10 relative mt-20 md:mt-0">
                <h1 class="font-serif text-[18vw] md:text-[12vw] leading-[0.85] tracking-tighter mb-8 md:mb-12">
                    <span class="block text-brand-white">DAVID</span>
                    <span class="block text-outline italic">MUNOZ</span>
                </h1>
                <p class="text-xl md:text-3xl font-serif font-light max-w-lg leading-snug">
                    Graphic design for the human experience. <br>
                    <span class="font-sans text-base md:text-xl opacity-90 mt-4 block font-light">Full portfolio currently in development.</span>
                </p>
            </div>
        </div>

        <!-- Right Pane: Information & Action (Deep Onyx) -->
        <div class="w-full md:w-1/2 bg-brand-black p-8 md:p-12 lg:p-20 flex flex-col justify-between min-h-[50vh] md:min-h-screen">
            
            <div class="space-y-16 md:space-y-24 mt-auto md:mt-20">
                
                <!-- Availability Grid -->
                <div>
                    <h2 class="text-brand-orange text-xs md:text-sm tracking-[0.2em] uppercase mb-6 font-medium">Current Availability</h2>
                    <ul class="space-y-4 text-lg md:text-xl font-light text-gray-300">
                        <li class="flex items-center gap-4">
                            <span class="relative flex h-3 w-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-orange opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-brand-orange"></span>
                            </span>
                            On-Site in Austin, Texas
                        </li>
                        <li class="flex items-center gap-4">
                            <span class="relative flex h-3 w-3">
                              <span class="relative inline-flex rounded-full h-3 w-3 border border-brand-orange"></span>
                            </span>
                            Remote (CST & EST Timezones)
                        </li>
                    </ul>
                </div>

                <!-- Contact & Connect -->
                <div>
                     <h2 class="text-brand-orange text-xs md:text-sm tracking-[0.2em] uppercase mb-6 font-medium">Contact & Connect</h2>
                     <div class="flex flex-col space-y-4 text-lg md:text-xl font-light">
                         <a href="mailto:davidselecto@gmail.com" class="hover:text-brand-orange transition-colors duration-300 border-b border-transparent hover:border-brand-orange w-fit pb-1">
                            davidselecto@gmail.com
                         </a>
                         <a href="https://www.linkedin.com/in/cdavidmunoz" target="_blank" rel="noopener noreferrer" class="group flex items-center gap-2 hover:text-brand-orange transition-colors duration-300 w-fit">
                             LinkedIn 
                             <span class="transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform text-brand-orange">↗</span>
                         </a>
                         <a href="https://profile.indeed.com/p/davidm-xrlxe44" target="_blank" rel="noopener noreferrer" class="group flex items-center gap-2 hover:text-brand-orange transition-colors duration-300 w-fit">
                             Indeed 
                             <span class="transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform text-brand-orange">↗</span>
                         </a>
                     </div>
                </div>
            </div>

            <!-- Request Resume Button -->
            <div class="mt-20 md:mt-auto pt-8 border-t border-gray-800">
                <a href="mailto:davidselecto@gmail.com?subject=Resume%20Request%20-%20David%20Munoz%20Portfolio&body=Hi%20David%2C%0A%0AI%20was%20browsing%20your%20landing%20page%20and%20would%20love%20to%20request%20a%20copy%20of%20your%20current%20resume.%0A%0AThank%20you!"
                   class="group inline-flex items-center justify-center px-8 py-4 md:px-10 md:py-5 bg-brand-white text-brand-black font-medium text-lg rounded-full hover:bg-brand-orange hover:text-brand-white transition-all duration-300">
                    Request Resume
                    <svg class="w-5 h-5 ml-3 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>

        </div>
    </main>

</body>
</html>
