<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — David Munoz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F1E8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT@9..144,300..900,50&display=swap" rel="stylesheet">
<style>
:root { --ink: #100F0D; --bone: #F5F1E8; --amber: #C8692A; --amber-text: #A8521C; --ink-60: rgba(16, 15, 13, .6); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh;
  display: grid; place-content: center; gap: 28px;
  padding: 32px clamp(16px, 4vw, 48px);
  background: var(--bone); color: var(--ink);
  font-family: "DM Mono", ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
}
.kicker { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-60); }
h1 {
  margin: 0; max-width: 12ch;
  font-family: "Fraunces", Georgia, serif; font-weight: 400;
  font-size: clamp(44px, 10.5vw, 120px); line-height: .92; letter-spacing: -.035em;
  font-variation-settings: "opsz" 144, "SOFT" 50;
}
h1 em { font-style: italic; font-weight: 300; color: var(--amber); }
.btn {
  justify-self: start; display: inline-flex; align-items: center;
  min-height: 48px; padding: 0 20px;
  font-size: 13px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
  background: var(--ink); color: var(--bone); border: 1px solid var(--ink);
}
.btn:hover { background: var(--amber-text); border-color: var(--amber-text); }
.btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
</style>
</head>
<body>
<main style="display:contents">
  <p class="kicker">Error 404 — off the sheet</p>
  <h1>This page was <em>trimmed.</em></h1>
  <a class="btn" href="/">Back to the home page</a>
</main>
</body>
</html>
